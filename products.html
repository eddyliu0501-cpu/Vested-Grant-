<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-zh="版权仓库 - 溯源链" data-en="Copyright Repository - Provenance Chain">版权仓库 - 溯源链</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 版权仓库专属样式 */
        .repo-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card);
            color: var(--text);
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
        }
        .add-btn {
            padding: 0.8rem 1.5rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }
        .add-btn:hover {
            background: #0056b3;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 3px 10px var(--shadow);
        }
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .empty-state h3 {
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        .empty-state p {
            color: #888;
            margin-bottom: 1.5rem;
        }
        .copyright-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .copyright-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 3px 10px var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 4px solid var(--primary);
            position: relative;
        }
        .copyright-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow);
        }
        .copyright-card .type-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: rgba(0,123,255,0.1);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .copyright-card h4 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        .copyright-card .info {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 0.3rem;
        }
        .copyright-card .delete-btn {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .copyright-card .delete-btn:hover {
            opacity: 1;
        }
        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            margin-bottom: 1.5rem;
            color: var(--text);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }
        .modal-actions button {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .btn-cancel {
            background: #eee;
            border: none;
            color: #333;
        }
        .btn-cancel:hover {
            background: #ddd;
        }
        .btn-submit {
            background: var(--primary);
            border: none;
            color: #fff;
        }
        .btn-submit:hover {
            background: #0056b3;
        }
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
        .stats-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--card);
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow);
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }
        .stat-label {
            font-size: 0.85rem;
            color: #888;
        }
        @media (max-width: 768px) {
            .stats-bar {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo"><a href="index.html" data-zh="溯源链" data-en="Provenance Chain">溯源链</a></div>
            <nav class="nav" id="navMenu">
                <ul>
                    <li><a href="index.html" data-zh="首页" data-en="Home">首页</a></li>
                    <li><a href="about.html" data-zh="关于" data-en="About">关于</a></li>
                    <li><a href="products.html" class="active" data-zh="版权仓库" data-en="Repository">版权仓库</a></li>
                    <li><a href="services.html" data-zh="服务" data-en="Services">服务</a></li>
                    <li><a href="contact.html" data-zh="联系" data-en="Contact">联系</a></li>
                </ul>
                <button class="dark-toggle" id="darkToggle">🌙</button>
                <button class="lang-toggle" id="langToggle">EN</button>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h1 data-zh="版权仓库" data-en="Copyright Repository">版权仓库</h1>
            <p style="color: #888; margin-bottom: 1.5rem;" data-zh="管理和检索所有版权信息" data-en="Manage and search all copyright information">管理和检索所有版权信息</p>
            
            <!-- 搜索栏 -->
            <div class="repo-header">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索版权名称、类型、编号..." data-placeholder-zh="搜索版权名称、类型、编号..." data-placeholder-en="Search by name, type, number...">
                </div>
                <button class="add-btn" id="addBtn" data-zh="➕ 添加版权" data-en="➕ Add Copyright">➕ 添加版权</button>
            </div>

            <!-- 统计栏 -->
            <div class="stats-bar" id="statsBar" style="display: none;">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label" data-zh="版权总数" data-en="Total">版权总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="typeCount">0</div>
                    <div class="stat-label" data-zh="类型数" data-en="Types">类型数</div>
                </div>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <div class="icon">📦</div>
                <h3 data-zh="仓库是空的" data-en="Repository is empty">仓库是空的</h3>
                <p data-zh="还没有添加任何版权信息，点击上方按钮添加第一个版权" data-en="No copyright added yet. Click the button above to add your first one.">还没有添加任何版权信息，点击上方按钮添加第一个版权</p>
                <button class="add-btn" onclick="openModal()" data-zh="添加第一个版权" data-en="Add First Copyright">添加第一个版权</button>
            </div>

            <!-- 版权列表 -->
            <div class="copyright-grid" id="copyrightGrid"></div>

            <!-- 无搜索结果 -->
            <div class="no-results" id="noResults" style="display: none;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
                <p data-zh="没有找到匹配的版权信息" data-en="No matching copyright found">没有找到匹配的版权信息</p>
            </div>
        </div>
    </main>

    <!-- 添加/编辑弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modalTitle" data-zh="添加版权" data-en="Add Copyright">添加版权</h3>
            <form id="copyrightForm">
                <div class="form-group">
                    <label data-zh="版权名称 *" data-en="Copyright Name *">版权名称 *</label>
                    <input type="text" id="copyrightName" required placeholder="例如：XX软件著作权" data-placeholder-zh="例如：XX软件著作权" data-placeholder-en="e.g. XX Software Copyright">
                </div>
                <div class="form-group">
                    <label data-zh="版权类型 *" data-en="Copyright Type *">版权类型 *</label>
                    <select id="copyrightType" required>
                        <option value="" data-zh="请选择类型" data-en="Select type">请选择类型</option>
                        <option value="软件著作权" data-en-type="Software Copyright">软件著作权</option>
                        <option value="作品著作权" data-en-type="Work Copyright">作品著作权</option>
                        <option value="商标权" data-en-type="Trademark">商标权</option>
                        <option value="专利权" data-en-type="Patent">专利权</option>
                        <option value="集成电路布图设计" data-en-type="IC Layout Design">集成电路布图设计</option>
                        <option value="其他" data-en-type="Other">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-zh="版权编号" data-en="Registration Number">版权编号</label>
                    <input type="text" id="copyrightNumber" placeholder="例如：软著登字第XXXXX号" data-placeholder-zh="例如：软著登字第XXXXX号" data-placeholder-en="e.g. Reg. No. XXXXX">
                </div>
                <div class="form-group">
                    <label data-zh="权利人" data-en="Rights Holder">权利人</label>
                    <input type="text" id="copyrightHolder" placeholder="版权所有者名称" data-placeholder-zh="版权所有者名称" data-placeholder-en="Name of the rights holder">
                </div>
                <div class="form-group">
                    <label data-zh="登记日期" data-en="Registration Date">登记日期</label>
                    <input type="date" id="copyrightDate">
                </div>
                <div class="form-group">
                    <label data-zh="备注说明" data-en="Notes">备注说明</label>
                    <textarea id="copyrightNotes" placeholder="其他补充信息" data-placeholder-zh="其他补充信息" data-placeholder-en="Additional information"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()" data-zh="取消" data-en="Cancel">取消</button>
                    <button type="submit" class="btn-submit" data-zh="保存" data-en="Save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p data-zh="© 2026 溯源链 | 保留所有权利" data-en="© 2026 Provenance Chain | All Rights Reserved">© 2026 溯源链 | All Rights Reserved</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // 版权仓库功能
        let copyrights = JSON.parse(localStorage.getItem('copyrights') || '[]');
        let currentLang = localStorage.getItem('language') || 'zh';

        const searchInput = document.getElementById('searchInput');
        const addBtn = document.getElementById('addBtn');
        const modal = document.getElementById('modal');
        const form = document.getElementById('copyrightForm');
        const emptyState = document.getElementById('emptyState');
        const grid = document.getElementById('copyrightGrid');
        const noResults = document.getElementById('noResults');
        const statsBar = document.getElementById('statsBar');

        function init() {
            renderCopyrights();
            updatePlaceholders();
            applyLanguageToTypes();
        }

        function getTypeDisplay(type) {
            if (currentLang === 'en') {
                const option = document.querySelector(`option[value="${type}"]`);
                if (option && option.getAttribute('data-en-type')) {
                    return option.getAttribute('data-en-type');
                }
            }
            return type;
        }

        function applyLanguageToTypes() {
            const typeOptions = document.querySelectorAll('#copyrightType option');
            typeOptions.forEach(opt => {
                if (currentLang === 'en' && opt.getAttribute('data-en-type')) {
                    opt.textContent = opt.getAttribute('data-en-type');
                } else if (opt.value) {
                    opt.textContent = opt.value;
                } else {
                    opt.textContent = currentLang === 'zh' ? '请选择类型' : 'Select type';
                }
            });
        }

        function renderCopyrights(searchTerm = '') {
            const filtered = copyrights.filter(item => {
                if (!searchTerm) return true;
                const term = searchTerm.toLowerCase();
                return (
                    item.name.toLowerCase().includes(term) ||
                    item.type.toLowerCase().includes(term) ||
                    (item.number && item.number.toLowerCase().includes(term)) ||
                    (item.holder && item.holder.toLowerCase().includes(term))
                );
            });

            if (copyrights.length === 0) {
                emptyState.style.display = 'block';
                grid.style.display = 'none';
                noResults.style.display = 'none';
                statsBar.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            statsBar.style.display = 'flex';

            document.getElementById('totalCount').textContent = copyrights.length;
            const uniqueTypes = new Set(copyrights.map(c => c.type));
            document.getElementById('typeCount').textContent = uniqueTypes.size;

            if (filtered.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            grid.innerHTML = filtered.map(item => `
                <div class="copyright-card">
                    <button class="delete-btn" onclick="deleteCopyright('${item.id}')" title="${currentLang === 'zh' ? '删除' : 'Delete'}">×</button>
                    <span class="type-badge">${getTypeDisplay(item.type)}</span>
                    <h4>${item.name}</h4>
                    ${item.number ? `<div class="info">📋 ${item.number}</div>` : ''}
                    ${item.holder ? `<div class="info">👤 ${item.holder}</div>` : ''}
                    ${item.date ? `<div class="info">📅 ${item.date}</div>` : ''}
                    ${item.notes ? `<div class="info" style="margin-top: 0.5rem; font-style: italic;">${item.notes}</div>` : ''}
                </div>
            `).join('');
        }

        function openModal() {
            modal.classList.add('active');
            form.reset();
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function deleteCopyright(id) {
            const confirmText = currentLang === 'zh' ? '确定要删除这条版权信息吗？' : 'Are you sure you want to delete this?';
            if (confirm(confirmText)) {
                copyrights = copyrights.filter(item => item.id !== id);
                saveData();
                renderCopyrights(searchInput.value);
            }
        }

        function saveData() {
            localStorage.setItem('copyrights', JSON.stringify(copyrights));
        }

        function updatePlaceholders() {
            const lang = currentLang;
            const inputs = document.querySelectorAll('[data-placeholder-zh]');
            inputs.forEach(input => {
                input.placeholder = input.getAttribute('data-placeholder-' + lang);
            });
        }

        function refreshAll() {
            currentLang = localStorage.getItem('language') || 'zh';
            updatePlaceholders();
            applyLanguageToTypes();
            renderCopyrights(searchInput.value);
        }

        addBtn.addEventListener('click', openModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newItem = {
                id: Date.now().toString(),
                name: document.getElementById('copyrightName').value,
                type: document.getElementById('copyrightType').value,
                number: document.getElementById('copyrightNumber').value,
                holder: document.getElementById('copyrightHolder').value,
                date: document.getElementById('copyrightDate').value,
                notes: document.getElementById('copyrightNotes').value
            };
            copyrights.unshift(newItem);
            saveData();
            renderCopyrights(searchInput.value);
            closeModal();
        });

        searchInput.addEventListener('input', (e) => {
            renderCopyrights(e.target.value);
        });

        const langObserver = new MutationObserver(() => {
            refreshAll();
        });
        langObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });

        window.addEventListener('storage', (e) => {
            if (e.key === 'language') {
                refreshAll();
            }
        });

        init();
    </script>
</body>
</html>
